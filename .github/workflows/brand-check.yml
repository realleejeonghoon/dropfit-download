name: 통일 점검

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # 매일 9시 점검 묶음(daily-qa.yml)이 부름

permissions:
  contents: read

jobs:
  repo:
    name: 저장소 점검 (아이콘·페이지·버전·문안·확정값·색·휴대폰 폭)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow numpy playwright && python3 -m playwright install --with-deps chromium
      - run: python3 brand/check.py

  live:
    name: 공개 사이트 대조 (main과 같은지)
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 brand/check.py --live
