name: 통일 점검

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    name: 저장소 점검 (아이콘·페이지·버전·확정값·색)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow numpy
      - run: python3 brand/check.py

  live:
    name: 공개 사이트 대조 (main과 같은지)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 brand/check.py --live
