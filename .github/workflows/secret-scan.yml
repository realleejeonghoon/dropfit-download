# 비밀 값 검사 (2026-11-18 보안 점검, 정훈 님 "전부 넣기")
# push·PR마다 지금 판을, 매주 월요일 09:20 KST에 모든 가지의 전체 기록을 본다. 리눅스 몇 초, 새 의존성·비밀 값 없음.
# 실패하면 .github/secret_scan.py가 파일·줄·종류만 적는다(값은 적지 않음).
name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: '20 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '1' }}
      - name: 지금 판
        run: python3 .github/secret_scan.py
      - name: 전체 기록 (매주)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          python3 .github/secret_scan.py --history
