name: Dropfit 끌어 옮기기 점검

# 클리앙 제보(11/5): 처음 설치하고 Dropfit을 끌어도 안 옮겨짐, 다시 설치하니 됨.
# 깨끗한 Mac에서 공개 중인 버전(main)과 이 PR의 새 버전을 사람처럼 받아 열고, 실제 마우스로 끌어 본다.
# 재발 방지: 업데이트 PR(zip이 바뀔 때)마다, 그리고 매일 09:20 KST 공개 버전으로.
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dropfit-macOS.zip'
      - 'brand/orb_*'
      - '.github/workflows/orb-drag.yml'

permissions:
  contents: read

jobs:
  mac:
    name: 끌어 옮기기 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 옛 버전(main의 공개 zip) 꺼내기
        run: |
          git show origin/main:Dropfit-macOS.zip > "$RUNNER_TEMP/old.zip"
          cp Dropfit-macOS.zip "$RUNNER_TEMP/new.zip"
          ls -l "$RUNNER_TEMP"/*.zip
      - name: 재현
        timeout-minutes: 18
        run: bash brand/orb_drag_mac.sh "$RUNNER_TEMP/old.zip" "$RUNNER_TEMP/new.zip" "$RUNNER_TEMP/orb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-drag-${{ matrix.os }}
          path: ${{ runner.temp }}/orb
          retention-days: 14
