name: 앱 점검

# 매일 09:10 KST: 공개 중인 Dropfit을 깨끗한 Mac(macOS 14·15)에 실제로 받아 설치·실행해 본다.
# 업데이트 PR(zip·appcast·점검 도구가 바뀔 때): 새 배포 파일로 같은 점검 = 출시 리허설.
on:
  workflow_call:   # 매일 9시 점검 묶음(daily-qa.yml)이 부름
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dropfit-macOS.zip'
      - 'updates/**'
      - 'appcast.xml'
      - 'brand/app_check*'
      - '.github/workflows/app-check.yml'

permissions:
  contents: read

jobs:
  mac:
    name: 깨끗한 Mac ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]   # GitHub가 11/6부터 macos-14를 내주지 않음. Intel Mac 사용자용으로 macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages cryptography pillow numpy || python3 -m pip install --quiet cryptography pillow numpy
      - name: 배포본 점검 (버전·서명·두 zip)
        run: python3 brand/app_check.py ${{ github.event_name == 'pull_request' && ' ' || '--live' }} --out "$RUNNER_TEMP/df"
      - name: 설치·실행 점검 (서명·공증·Gatekeeper·실행·화면 동작·아이콘)
        run: bash brand/app_check_mac.sh "$RUNNER_TEMP/df"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-check-${{ matrix.os }}
          path: ${{ runner.temp }}/df/report
          retention-days: 30
