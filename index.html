<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dropfit · 정식판이 출시되었습니다</title>
<meta name="description" content="드롭핏(Dropfit) 정식판이 출시되었습니다. 다운로드와 Pro 구입은 dropfit.kr에서 할 수 있습니다.">
<meta name="theme-color" content="#fbfbfd">
<link rel="canonical" href="https://dropfit.kr/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dropfit">
<meta property="og:title" content="Dropfit · 정식판이 출시되었습니다">
<meta property="og:url" content="https://dropfit.kr/">
<meta property="og:image" content="https://realleejeonghoon.github.io/dropfit-download/assets/og.png?v=10">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://realleejeonghoon.github.io/dropfit-download/assets/og.png?v=10">
<link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png?v=3">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  /* 안내판(11/11 확정): 정식판 한 줄 + [dropfit.kr로 가기] 하나. 자동 이동 없음. zip·appcast는 그대로 */
  :root { --blue: #3c608a; --ink: #1d1d1f; --ink-2: #6e6e73;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; word-break: keep-all; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 max(24px, env(safe-area-inset-left)) 0 max(24px, env(safe-area-inset-right)); }
  main { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: -6vh; }
  .icon { width: 112px; height: 112px; filter: drop-shadow(0 0 .5px rgba(18,28,45,.22)) drop-shadow(0 2px 6px rgba(18,28,45,.12)); }
  h1 { margin: 28px 0 0; font-size: clamp(30px, 4.2vw, 44px); line-height: 1.2; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
  .pill { display: inline-flex; align-items: center; justify-content: center; margin-top: 36px; background: var(--blue); color: #fff; border-radius: 980px;
    font-size: 17px; padding: 12px 26px; min-width: 196px; text-decoration: none; }
  .pill:focus-visible { outline: 3px solid rgba(60,96,138,.35); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/icon-256.png" alt="" width="112" height="112">
  <h1>정식판이 출시되었습니다</h1>
  <a class="pill" id="go" href="https://dropfit.kr/?from=gh-old">dropfit.kr로 가기</a>
</main>
<script>
  // 유입 표시: 이 주소로 들어온 ?from= 태그가 있으면 그대로 넘기고, 없으면 'gh-old'
  (function () { try { var f = (new URLSearchParams(location.search).get('from') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 12);
    if (f) document.getElementById('go').href = 'https://dropfit.kr/?from=' + f; } catch (e) {} })();
  // 방문 수: 탭당 1번, 채널만 보낸다(F-013). 버전 표시는 같이 공개되는 zip·appcast와 같아야 한다(brand/check.py)
  (function () { var VERSION = '1.0.2'; try { if (sessionStorage.getItem('dropfit-visit')) return; sessionStorage.setItem('dropfit-visit', '1');
    var vb = new URLSearchParams({ event: 'visit', src: 'gh-notice' }), u = 'https://script.google.com/macros/s/AKfycbyh4PCaMhGnR2MqHC5dj_C-kFilK0iX2a5KKrZfWOj4YpLEo8kA7RvDTG0PzrZMUg72tQ/exec';
    if (!(navigator.sendBeacon && navigator.sendBeacon(u, vb))) fetch(u, { method: 'POST', mode: 'no-cors', body: vb, keepalive: true }); } catch (e) {} })();
</script>
</body>
</html>
